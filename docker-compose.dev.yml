# docker-compose.dev.yml — local dev only, not deployed
services:
  postgres:
    image: postgres:18-alpine    # match production (Railway runs 18)
    container_name: skyhigh-pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyhigh
      POSTGRES_PASSWORD: skyhigh_dev
      POSTGRES_DB: skyhigh_dev
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/; the old 16 volume (skyhigh_pg_data) is kept, unused
      - skyhigh_pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyhigh -d skyhigh_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  skyhigh_pg18_data:
